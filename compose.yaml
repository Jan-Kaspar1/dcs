# The checked-in rig definition for the hot-swap demonstration — the
# artifact the two Dockerfiles presuppose (decision 49 in
# docs/architecture.md). It declares as data the same topology
# docs/packaging.md documents as commands: one dcs-plant-server
# container and a redundant dcs-controller pair attaching to its
# listener, the checked-in reference-station model and dynamics
# documents mounted read-only (decision 46 — deployment-supplied
# paths, never content over the wire), and the standby wired to the
# active's monitor.
#
# `docker compose config` statically checks the file;
# `docker compose build` produces the same dcs-controller and
# dcs-plant-server tags the documented `docker build` commands do;
# `docker compose up -d` starts the rig. Like the Dockerfiles, this is
# a checked-in packaging artifact: a single-host orchestration
# declaration that defines no deployment. The two-machine shape is the
# same declaration spread across hosts with published addresses in
# place of network names, as docs/packaging.md records.

name: dcs-rig

services:
  dcs-plant:
    image: dcs-plant-server
    build:
      context: .
      dockerfile: Dockerfile.plant
    container_name: dcs-plant
    networks:
      - dcs-rig
    volumes:
      - ./crates/dcs-demo/fixtures/pump_station.json:/model/plant.json:ro
      - ./crates/dcs-demo/fixtures/pump_station_dynamics.json:/model/dynamics.json:ro
    command:
      - /model/plant.json
      - --dynamics
      - /model/dynamics.json
      - --listen
      - 0.0.0.0:9001
    # The controllers' --remote attach connects once at startup and
    # exits if the listener is not yet bound, so the pair orders on the
    # plant actually serving. The gate is the image's declared
    # HEALTHCHECK — dcs-plant-ctl's `ping` liveness probe on the
    # default 127.0.0.1:9001 — which reports healthy only once the
    # listener answers the plant protocol, not merely once the port
    # accepts connections.

  ctrl-a:
    image: dcs-controller
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctrl-a
    depends_on:
      dcs-plant:
        condition: service_healthy
    networks:
      - dcs-rig
    ports:
      - "8080:8080"
    volumes:
      - ./crates/dcs-demo/fixtures/pump_station.json:/model/plant.json:ro
    # The image's HEALTHCHECK probes DCS_MONITOR_ADDR — the declared
    # 8080 default already matches; naming it keeps the peer pair's
    # declaration symmetric.
    environment:
      DCS_MONITOR_ADDR: 127.0.0.1:8080
    command:
      - /model/plant.json
      - --remote
      - dcs-plant:9001
      - --scan-ms
      - "100"
      - --listen
      - 0.0.0.0:8080
      # The pair's shared tracking secret: both peers carry the same
      # token so announced-source demotions and the adopted source's
      # checkpoints carry the keyed line proof — an endpoint that
      # merely replays or fabricates this line's documents can neither
      # arm the demotion nor feed the demoted peer.
      - --pair-token
      - dcs-rig-pair

  ctrl-b:
    image: dcs-controller
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctrl-b
    depends_on:
      dcs-plant:
        condition: service_healthy
      ctrl-a:
        condition: service_started
    networks:
      - dcs-rig
    ports:
      - "8081:8081"
    volumes:
      - ./crates/dcs-demo/fixtures/pump_station.json:/model/plant.json:ro
    # The image's HEALTHCHECK probes DCS_MONITOR_ADDR — this peer's
    # monitor listens on 8081, not the 8080 default.
    environment:
      DCS_MONITOR_ADDR: 127.0.0.1:8081
    command:
      - /model/plant.json
      - --remote
      - dcs-plant:9001
      - --standby
      - ctrl-a:8080
      - --scan-ms
      - "100"
      - --listen
      - 0.0.0.0:8081
      - --pair-token
      - dcs-rig-pair

networks:
  dcs-rig:
    name: dcs-rig
