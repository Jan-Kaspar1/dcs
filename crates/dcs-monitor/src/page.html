<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dcs-monitor</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 64rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 0.25rem 0.6rem; text-align: left; }
  th { background: #f0f0f0; }
  td.value { font-variant-numeric: tabular-nums; }
  .good { color: #060; }
  .uncertain { color: #a60; }
  .bad { color: #b00; font-weight: bold; }
  .nosample { color: #888; font-style: italic; }
  #status { color: #666; }
  #receipt { background: #f6f6f6; padding: 0.5rem; white-space: pre-wrap; }
  #trends { display: flex; flex-wrap: wrap; gap: 1rem; }
  .trend { margin: 0; }
  .trend figcaption { font-size: 0.85rem; color: #444; margin-bottom: 0.25rem; }
  .trend svg { display: block; border: 1px solid #ccc; background: #fbfbfb; }
  .trend polyline { fill: none; stroke: #146; stroke-width: 1.5; }
  .trend .limit { fill: #888; font-size: 9px; }
  .trend circle.uncertain { fill: #a60; }
  .trend circle.bad { fill: #b00; }
  tr.point-group th { background: #e4e4e4; text-align: left; }
  tr.source td { font-weight: bold; }
  #health { display: flex; flex-wrap: wrap; gap: 1rem 3rem; align-items: flex-start; }
  #health > section { flex: 1 1 24rem; }
  #pair-summary.good, #io-health-summary.good { color: #060; }
  #pair-summary.bad, #io-health-summary.bad { color: #b00; font-weight: bold; }
  #faceplates { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
  .faceplate { border: 1px solid #bbb; border-radius: 4px; padding: 0.5rem 0.9rem;
    min-width: 16rem; background: #fdfdfd; }
  .faceplate h3 { margin: 0.2rem 0 0.5rem; }
  .faceplate h3 .kind { font-size: 0.75rem; font-weight: normal; color: #777; }
  .faceplate .role { display: flex; justify-content: space-between; align-items: baseline;
    gap: 0.6rem; margin: 0.25rem 0; }
  .faceplate .role .value { font-variant-numeric: tabular-nums; }
  .faceplate .role-process_value .value { font-size: 1.35rem; font-weight: 600; }
  .faceplate .flag { display: inline-block; margin: 0.15rem 0.3rem 0.15rem 0;
    padding: 0 0.45rem; border: 1px solid #ccc; border-radius: 3px;
    background: #eee; color: #555; }
  .faceplate .flag.on { background: #fee; border-color: #b00; color: #b00; font-weight: bold; }
  .faceplate table { margin-top: 0.4rem; font-size: 0.85rem; }
  .faceplate .diag { margin-top: 0.45rem; font-size: 0.8rem; color: #666; }
  .faceplate .diag .errors { color: #b00; font-weight: bold; }
  .command input { width: 6rem; }
  .command button { margin-left: 0.3rem; }
  .faceplate .param-value { width: 6.5rem; }
  .faceplate select.param-value { width: auto; }
  .faceplate button.tune { margin-left: 0.3rem; }
  .faceplate .param-status { font-size: 0.8rem; color: #666; }
  .faceplate .param-status.warn { color: #a60; }
  .faceplate .param-status.bad { color: #b00; font-weight: bold; }
</style>
</head>
<body>
<h1>Plant monitoring</h1>
<p id="status">connecting&hellip;</p>

<div id="health">
<section id="pair" hidden>
<h2>Controller pair</h2>
<p id="pair-summary"></p>
<table>
  <thead>
    <tr><th>Peer</th><th>Role</th><th>Standby sync</th><th>Tick</th><th>Status</th></tr>
  </thead>
  <tbody id="pair-peers"></tbody>
</table>
</section>

<section id="io-health" hidden>
<h2>I/O health</h2>
<p id="io-health-summary"></p>
<table>
  <tbody id="io-health-rows"></tbody>
</table>
</section>
</div>

<h2>Components</h2>
<div id="faceplates"></div>

<table>
  <thead>
    <tr>
      <th>Point</th><th>Signal</th><th>Direction</th><th>Type</th>
      <th>Value</th><th>Quality</th><th>Unit</th><th>Tick</th>
    </tr>
  </thead>
  <tbody id="points"></tbody>
</table>

<h2>Trends</h2>
<div id="trends"></div>

<h2>Journal</h2>
<table>
  <thead>
    <tr><th>Seq</th><th>Tick</th><th>Event</th></tr>
  </thead>
  <tbody id="journal"></tbody>
</table>

<h2>Operator command</h2>
<form id="command-form">
  <label>Signal <select id="command-point" required></select></label>
  <label>Value <input id="command-value" required></label>
  <button type="submit">Write value</button>
</form>
<pre id="receipt"></pre>

<script>
"use strict";
// The page speaks only the monitor's JSON contract: GET /signals for the
// loaded model's point metadata, GET /role for a peer's redundancy role,
// GET /snapshot for live samples and per-component descriptors, GET
// /history for each point's retained sample stream, GET /journal for the
// transition journal, and POST /command for operator writes. Roles,
// snapshot, history, and journal are polled on one shared one-second
// cadence; the history and journal fetches carry since-cursors, so each
// poll transfers only entries newer than the last seen sequence. No
// dependencies, no build step.
//
// Component faceplates render generically from the snapshot's
// descriptors — one per component instance, no per-kind page code. A
// port's role hint picks the conventional element (process-value
// display, setpoint field, driven output, status flag), `port.point`
// joins the port to its live point telemetry and signal metadata, and a
// command affordance appears only where that metadata marks the bound
// point writable. Each declared parameter renders an edit control
// typed to its declared value kind and labeled with its declared
// range; submitting issues a set_parameter command through the
// receipted path, with the applied tick or named rejection surfaced on
// the parameter's row and in the journal pane. A descriptor with no
// role hints and no parameters — a kind that shipped no custom
// describe — degrades to a generic
// name-plus-diagnostics-plus-wired-points view, never an error.
//
// Pair view (the monitoring-under-redundancy decision): the page is
// configured with both peers' monitor addresses — the serving origin is
// one peer, and each ?peer=<host:port> URL parameter names another. With
// no ?peer the page is a single-controller view and every fetch stays
// same-origin. Under a pair, every refresh polls GET /role on each peer,
// the data endpoints are read from the peer reporting "active" — one
// logical controller — and the other peer contributes pair health only.
// Commands submit only to the settled-active peer; a "not_active"
// rejection means the command landed mid-transition, so roles are
// re-polled and the command retried once. Beside the pair's role and
// convergence reporting the I/O-health pane renders the snapshot's
// io_health section — the executor's boundary counters and attributed
// last fault, the driver's volunteered link diagnostics, and the pacing
// shell's scan-overrun count — so operator-facing health reads as one
// surface.
const peers = [{ base: "", name: location.host }];
for (const raw of new URLSearchParams(location.search).getAll("peer")) {
  const base = /^https?:\/\//.test(raw) ? raw.replace(/\/$/, "")
                                       : location.protocol + "//" + raw;
  if (base !== location.origin && !peers.some(peer => peer.base === base)) {
    peers.push({ base, name: raw.replace(/^https?:\/\//, "") });
  }
}
// Per-peer last-polled state: { report: RoleReport | null, error } —
// error non-null is the named unreachable redundancy fault.
const peerState = peers.map(() => ({ report: null, error: null }));
// Index of the peer currently sourcing the logical view's data.
let source = 0;

// Signals declare an optional display group in the model; the point
// listing organizes itself under those groups. A point whose signal —
// or whose missing signal — declares none lists under DEFAULT_GROUP.
const DEFAULT_GROUP = "ungrouped";
function pointGroup(meta) {
  return meta.group || DEFAULT_GROUP;
}

// Buckets the index's points under their display group. Groups appear in
// the order they first occur in the index (the model's point order), so
// the listing's organization comes from the model, not the page.
function groupedPoints() {
  const groups = new Map();
  for (const meta of index.points) {
    const group = pointGroup(meta);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(meta);
  }
  return groups;
}

let index = { points: [] };
// point id -> PointSignal metadata, built once from the fetched index:
// the writable flag that gates every command affordance lives here.
const metaByPoint = new Map();
// point id -> { samples: [Sample], lastSeq, lastTick } — the series a
// trend draws. lastSeq is the since-cursor in the *current* source's
// stream; lastTick is the merge watermark that keeps the series
// continuous across a source switch.
const trends = new Map();
// The retained journal window, oldest first.
const journalEntries = [];
// Events already displayed — tick plus serialized event — so a journal
// re-fetch from the new source after a switch adds each transition once.
const journalSeen = new Set();
let journalSince = 0;
// component name -> its served descriptor, rebuilt on every poll: the
// parameter edit path reads declared kinds and ranges from it — the
// descriptor is the page's authority for what a tunable accepts.
const descriptorByName = new Map();
// paramKey(component, name) -> { text, warn, bad }: the receipted
// path's latest answer for that tunable — what its row's status cell
// shows. "accepted for tick N" at submission; "applied at tick N" or
// "rejected: <named reason>" once the journal reports the settled
// receipt. The map survives the per-poll faceplate re-render.
const paramStatus = new Map();
function paramKey(component, name) {
  return component + "\n" + name;
}
// Client-side display bounds; the server's rings bound retention anyway.
const TREND_LIMIT = 600;
const JOURNAL_LIMIT = 300;

function esc(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

// Value serializes as {"Bool": b} | {"Int": i} | {"Float": f}.
function formatValue(value) {
  if (value == null) return "";
  if ("Bool" in value) return value.Bool ? "true" : "false";
  if ("Int" in value) return String(value.Int);
  if ("Float" in value) return String(value.Float);
  return JSON.stringify(value);
}

// The numeric ordinate a trend plots for a value; Bool draws as 0/1.
function numericValue(value) {
  if (value == null) return null;
  if ("Bool" in value) return value.Bool ? 1 : 0;
  if ("Int" in value) return value.Int;
  if ("Float" in value) return value.Float;
  return null;
}

// Quality serializes as "Good" | {"Uncertain": reason} | {"Bad": reason}.
function formatQuality(quality) {
  if (typeof quality === "string") return quality;
  const [severity, reason] = Object.entries(quality)[0];
  return severity + " (" + reason + ")";
}

function isGood(quality) {
  return quality === "Good";
}

function qualityClass(quality) {
  const severity = typeof quality === "string" ? quality : Object.keys(quality)[0];
  return esc(severity.toLowerCase());
}

// The signal-index name for a point, falling back to the bare id.
function pointName(point) {
  const meta = index.points.find(p => p.point === point);
  return meta ? meta.name + " (point " + point + ")" : "point " + point;
}

// Polls GET /role on every configured peer — the role cadence the pair
// view adds to the normal data polling — then re-selects the data
// source. A failed poll is recorded as pair health, not thrown: one
// peer's loss must not interrupt the other peer's data.
async function pollRoles() {
  await Promise.all(peers.map(async (peer, i) => {
    try {
      const response = await fetch(peer.base + "/role");
      if (!response.ok) throw new Error("HTTP " + response.status);
      peerState[i].report = await response.json();
      peerState[i].error = null;
    } catch (error) {
      peerState[i].error = String(error);
    }
  }));
  selectSource();
}

// The logical view reads from the peer reporting settled "active".
// During a switchover a "promoting" peer already owns the field and is
// becoming active, so it sources the view until it settles; otherwise the
// previous source stays while it remains reachable.
function selectSource() {
  const reachable = i => peerState[i].error === null && peerState[i].report !== null;
  let next = peerState.findIndex((state, i) =>
    reachable(i) && state.report.role === "active");
  if (next < 0) next = peerState.findIndex((state, i) =>
    reachable(i) && state.report.role === "promoting");
  if (next < 0) {
    next = reachable(source) ? source : peerState.findIndex((s, i) => reachable(i));
  }
  if (next >= 0 && next !== source) switchSource(next);
}

// Moves the data source to another peer: the new peer's history and
// journal are re-fetched whole (since 0) and merged by tick — the pair
// shares one tick domain, so the trend and journal panes continue the
// same run without duplicating samples.
function switchSource(next) {
  source = next;
  for (const state of trends.values()) state.lastSeq = 0;
  journalSince = 0;
}

// The index of a peer reporting settled "active" — the only legitimate
// command target — or -1 while the pair is mid-transition or its active
// is lost.
function activePeer() {
  return peerState.findIndex(state =>
    state.error === null && state.report && state.report.role === "active");
}

// StandbySync serializes as "unsynchronized" | {"tracking": {aligned}} |
// {"degraded": {detail}} | {"diverged": {mismatches}}.
function describeSync(sync) {
  if (typeof sync === "string") return sync;
  if ("tracking" in sync) {
    return "tracking (aligned at tick " + sync.tracking.aligned + ")";
  }
  if ("degraded" in sync) return "degraded: " + sync.degraded.detail;
  if ("diverged" in sync) {
    return "diverged: staged outputs mismatch the field at " +
      sync.diverged.mismatches.map(m => m.point).join(", ");
  }
  return JSON.stringify(sync);
}

// The pair's redundancy summary: healthy, or the named redundancy
// faults — an unreachable peer, a degraded or diverged standby
// convergence, or no peer reporting active. These are pair health,
// never plant faults.
function pairSummary() {
  const faults = [];
  let activeName = null;
  peers.forEach((peer, i) => {
    const state = peerState[i];
    if (state.error !== null) {
      const was = state.report ? state.report.role + " " : "";
      faults.push(was + peer.name + " unreachable");
      return;
    }
    if (state.report === null) return;
    if (state.report.role === "active") activeName = peer.name;
    if (state.report.sync && typeof state.report.sync === "object") {
      if ("degraded" in state.report.sync) {
        faults.push(peer.name + " sync degraded: " + state.report.sync.degraded.detail);
      }
      if ("diverged" in state.report.sync) {
        faults.push(peer.name + " standby diverged: staged outputs mismatch the field at " +
          state.report.sync.diverged.mismatches.map(m => m.point).join(", "));
      }
    }
  });
  if (activeName === null) faults.push("no peer reports role active");
  return faults.length === 0
    ? "redundant pair healthy — active on " + activeName
    : "redundancy fault: " + faults.join("; ");
}

// Renders the pair section — one row per peer, plus the summary — when
// the page is configured for a pair; hidden for a single controller.
function renderPair() {
  const section = document.getElementById("pair");
  if (peers.length < 2) {
    section.hidden = true;
    return;
  }
  section.hidden = false;
  document.getElementById("pair-peers").innerHTML = peers.map((peer, i) => {
    const state = peerState[i];
    const report = state.report;
    const unreachable = state.error !== null;
    return "<tr" + (i === source ? " class=\"source\"" : "") + "><td>" +
      esc(peer.name) + "</td><td>" + (report ? esc(report.role) : "—") +
      "</td><td>" + (report && report.sync ? esc(describeSync(report.sync)) : "—") +
      "</td><td>" + (report ? report.tick : "—") + "</td><td class=\"" +
      (unreachable ? "bad" : "good") + "\">" +
      (unreachable ? "unreachable" : (i === source ? "serving" : "reachable")) +
      "</td></tr>";
  }).join("");
  const summary = document.getElementById("pair-summary");
  summary.textContent = pairSummary();
  summary.className = activePeer() >= 0 &&
    peerState.every(state => state.error === null) ? "good" : "bad";
}

let polling = false;
async function refresh() {
  if (polling) return;
  polling = true;
  try {
    await pollRoles();
    renderPair();
    const base = peers[source].base;
    const snapshot = await (await fetch(base + "/snapshot")).json();
    const peerNote = peers.length > 1 ? " — active peer " + peers[source].name : "";
    document.getElementById("status").textContent =
      "tick " + snapshot.tick + peerNote + " — polled " +
      new Date().toLocaleTimeString();
    renderIoHealth(snapshot.io_health);
    const telemetry = new Map(snapshot.points.map(p => [p.point, p]));
    renderFaceplates(snapshot, telemetry);
    const rows = [];
    for (const [group, metas] of groupedPoints()) {
      rows.push("<tr class=\"point-group\"><th colspan=\"8\">" + esc(group) +
        "</th></tr>");
      for (const meta of metas) rows.push(pointRow(meta, telemetry));
    }
    document.getElementById("points").innerHTML = rows.join("");
    await Promise.all([refreshTrends(base), refreshJournal(base)]);
  } catch (error) {
    document.getElementById("status").textContent = "poll failed: " + error;
  } finally {
    polling = false;
  }
}

// The snapshot's I/O health section, rendered as its own pane beside
// the pair view's role and convergence reporting — one surface for
// operator-facing health. The driver's volunteered diagnostics get rows
// of their own: a dead transport names link degradation there, visibly
// separate from the per-point quality column below. IoFault serializes
// as {tick, point, direction, error}, an IoError as
// {"Disconnected": id} | {"Timeout": id} | {"UnknownPoint": id} |
// {"TypeMismatch": {point, expected, found}}, a LinkState as
// "connected" | "disconnected", and a Direction as "in" | "out".
function describeIoError(error) {
  const [variant, detail] = Object.entries(error)[0];
  const name = variant.replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase();
  if (variant === "TypeMismatch") {
    return name + " on point " + detail.point + " (expects " +
      detail.expected + ", found " + formatValue(detail.found) + ")";
  }
  return name + " on point " + detail;
}

function healthRow(label, value) {
  return "<tr><th>" + esc(label) + "</th><td>" + esc(value) + "</td></tr>";
}

function renderIoHealth(health) {
  const pane = document.getElementById("io-health");
  if (!health) { pane.hidden = true; return; }
  const rows = [];
  let troubled = false;
  if (health.driver) {
    // Link health is transport health, not point health: a dead plant
    // server names "disconnected" here while the same event only marks
    // individual points' samples Bad below.
    rows.push(healthRow("link", health.driver.link));
    if (health.driver.link !== "connected") troubled = true;
    if (health.driver.last_error) {
      rows.push(healthRow("last link failure", health.driver.last_error));
    }
  }
  rows.push(healthRow("failed reads", health.failed_reads));
  rows.push(healthRow("failed writes", health.failed_writes));
  rows.push(healthRow("consecutive failures", health.consecutive_failures));
  if (health.failed_reads || health.failed_writes) troubled = true;
  if (health.last_error) {
    const fault = health.last_error;
    rows.push(healthRow("last I/O fault",
      describeIoError(fault.error) + " — " +
      (fault.direction === "in" ? "read" : "write") + " boundary, " +
      pointName(fault.point) + ", tick " + fault.tick));
    troubled = true;
  }
  // The pacing shell's overrun count, displayed when nonzero.
  if (health.scan_overruns) {
    rows.push(healthRow("scan overruns", health.scan_overruns));
    troubled = true;
  }
  document.getElementById("io-health-rows").innerHTML = rows.join("");
  const summary = document.getElementById("io-health-summary");
  summary.textContent = troubled ? "I/O degraded" : "I/O healthy";
  summary.className = troubled ? "bad" : "good";
  pane.hidden = false;
}

// One point's row in the listing table.
function pointRow(meta, telemetry) {
  const sample = (telemetry.get(meta.point) || {}).sample;
  const quality = sample ? formatQuality(sample.quality) : "no sample";
  const cls = sample ? qualityClass(sample.quality) : "nosample";
  return "<tr><td>" + meta.point + "</td><td>" + esc(meta.name) + "</td><td>" +
    meta.direction + "</td><td>" + meta.value_type + "</td><td class=\"value\">" +
    (sample ? formatValue(sample.value) : "") + "</td><td class=\"" + cls + "\">" +
    esc(quality) + "</td><td>" + esc(meta.unit || "") + "</td><td>" +
    (sample ? sample.tick : "") + "</td></tr>";
}

// ---- Faceplates ----
//
// One faceplate per component instance, drawn generically from the
// snapshot's descriptors (the component self-description contract): the
// descriptor supplies the instance's name, kind, ports with role hints,
// and parameter metadata; the serving layer already annotated each port
// with its bound point, so port.point joins straight into live
// telemetry and the signal index. Command affordances attach only where
// the bound point's metadata is marked writable — the model-declared
// command surface — and a command attempted anywhere else rejects with
// not_writable, the rejection visible in the receipt pane and the
// journal. The parameter list is the other editable surface: each
// declared parameter renders an edit control typed to its declared
// kind, its submission issues a set_parameter command addressed to the
// instance through the same receipted path, and the answer — applied
// tick or named rejection — lands on the parameter's row. A kind
// declaring no parameters renders no parameter table at all: no edit
// affordance.

// The live sample a bound port shows, or null when unwired/unseen.
function portSample(port, telemetry) {
  return port.point == null ? null : (telemetry.get(port.point) || {}).sample || null;
}

// The port's bound point metadata — null when the port is unwired or
// its point has no index entry (e.g. a synthesized port-to-port link
// point, which is never a command target).
function portMeta(port) {
  return port.point == null ? null : metaByPoint.get(port.point) || null;
}

// A write affordance is offered only on a point the model marks
// writable: an unbound port, an unmarked point, or a point with no
// metadata is display-only — never silently commandable.
function commandAffordance(port, sample) {
  const meta = portMeta(port);
  if (!meta || !meta.writable) return "";
  return "<span class=\"command\"><input class=\"command-value\"" +
    " data-point=\"" + port.point + "\" size=\"9\"" +
    (sample ? " placeholder=\"" + esc(formatValue(sample.value)) + "\"" : "") +
    "><button type=\"button\" class=\"write\" data-point=\"" + port.point +
    "\">write</button></span>";
}

// The conventional element a role hint picks. Every element shows the
// port's bound-point metadata name, live value, unit, and quality; the
// command affordance follows the bound point's writable mark, not the
// role.
const ROLE_ORDER = { process_value: 0, setpoint: 1, output: 2, status: 3 };
function roleElement(port, telemetry) {
  const sample = portSample(port, telemetry);
  const meta = portMeta(port);
  const label = esc(port.name) + (meta ? " · " + esc(meta.name) : "");
  const unit = meta && meta.unit ? " " + esc(meta.unit) : "";
  const cls = sample ? qualityClass(sample.quality) : "nosample";
  const value = sample ? esc(formatValue(sample.value)) : "—";
  if (port.role === "status") {
    // A bool draws as an on/off flag; any other kind shows its value.
    const on = sample && sample.value && "Bool" in sample.value
      ? sample.value.Bool : null;
    const text = on === null
      ? port.name + ": " + (sample ? formatValue(sample.value) : "—")
      : port.name;
    return "<span class=\"flag" + (on ? " on" : "") + "\" title=\"" +
      esc(port.name) + (sample ? " — " + esc(formatQuality(sample.quality)) : "") +
      "\">" + esc(text) + "</span>" + commandAffordance(port, sample);
  }
  return "<div class=\"role role-" + esc(port.role) + "\">" +
    "<span class=\"caption\">" + label + "</span>" +
    "<span class=\"value " + cls + "\">" + value + unit + "</span>" +
    commandAffordance(port, sample) + "</div>";
}

// The generic per-port rows: unhinted ports inside a custom faceplate,
// or every port of a fallback faceplate.
function portTable(ports, telemetry) {
  if (ports.length === 0) return "";
  return "<table class=\"ports\"><thead><tr>" +
    "<th>Port</th><th>Dir</th><th>Point</th><th>Value</th><th>Quality</th><th></th>" +
    "</tr></thead><tbody>" +
    ports.map(port => {
      const sample = portSample(port, telemetry);
      const meta = portMeta(port);
      return "<tr><td>" + esc(port.name) + "</td><td>" + esc(port.direction) +
        "</td><td>" + (port.point == null ? "unwired"
          : "point " + port.point + (meta ? " · " + esc(meta.name) : "")) +
        "</td><td class=\"value\">" + (sample ? esc(formatValue(sample.value)) : "") +
        (meta && meta.unit ? " " + esc(meta.unit) : "") +
        "</td><td class=\"" + (sample ? qualityClass(sample.quality) : "nosample") +
        "\">" + (sample ? esc(formatQuality(sample.quality)) : "no sample") +
        "</td><td>" + commandAffordance(port, sample) + "</td></tr>";
    }).join("") + "</tbody></table>";
}

// The parameter list: each ParameterDescriptor renders its name, value
// kind, the declared range a tuning must satisfy, and an edit control
// typed to the kind — a true/false select for Bool, a text input for
// Int and Float — plus a status cell carrying the receipted path's
// latest answer for that tunable.
function parameterTable(descriptor) {
  return "<table class=\"params\"><thead><tr>" +
    "<th>Parameter</th><th>Kind</th><th>Range</th><th>Set</th><th></th>" +
    "</tr></thead><tbody>" +
    descriptor.parameters.map(param => {
      const status = paramStatus.get(paramKey(descriptor.name, param.name));
      return "<tr><td>" + esc(param.name) + "</td><td>" + esc(param.kind) +
        "</td><td>" +
        (param.range
          ? esc(formatValue(param.range.min)) + " … " +
            esc(formatValue(param.range.max))
          : "unbounded") +
        "</td><td>" + parameterControl(descriptor.name, param) +
        "<button type=\"button\" class=\"tune\" data-component=\"" +
        esc(descriptor.name) + "\" data-param=\"" + esc(param.name) +
        "\">set</button></td>" +
        "<td class=\"param-status" + (status && status.warn ? " warn" : "") +
        (status && status.bad ? " bad" : "") + "\" data-component=\"" +
        esc(descriptor.name) + "\" data-param=\"" + esc(param.name) + "\">" +
        (status ? esc(status.text) : "") + "</td></tr>";
    }).join("") + "</tbody></table>";
}

// One parameter's edit control, typed to the declared ValueKind and
// labeled with the declared range where present — as the control's
// tooltip, beside the Range column that states it outright. The
// data-component/data-param/data-kind attributes are what the submit
// handler reads.
function parameterControl(component, param) {
  const attrs = " data-component=\"" + esc(component) + "\" data-param=\"" +
    esc(param.name) + "\" data-kind=\"" + esc(param.kind) + "\"" +
    (param.range
      ? " title=\"" + esc(formatValue(param.range.min)) + " … " +
        esc(formatValue(param.range.max)) + "\""
      : "");
  if (param.kind === "Bool") {
    return "<select class=\"param-value\"" + attrs + ">" +
      "<option value=\"true\">true</option>" +
      "<option value=\"false\">false</option></select>";
  }
  return "<input class=\"param-value\"" + attrs + " size=\"9\"" +
    (param.kind === "Int" ? " inputmode=\"numeric\"" : " inputmode=\"decimal\"") +
    ">";
}

// Records the receipted path's latest answer for one parameter and
// paints it into every matching status cell — the map is the store and
// survives re-renders, the cell only displays it.
function setParamStatus(component, name, status) {
  paramStatus.set(paramKey(component, name), status);
  for (const cell of document.querySelectorAll("#faceplates .param-status")) {
    if (cell.dataset.component === component && cell.dataset.param === name) {
      cell.textContent = status.text;
      cell.className = "param-status" + (status.warn ? " warn" : "") +
        (status.bad ? " bad" : "");
    }
  }
}

// The client-side check against the descriptor's declared range —
// advisory only: a failing entry is warned and still sent, the
// receipted path staying the authority that names the rejection.
// Mirrors the contract's rule: the bounds carry the parameter's kind,
// so a value of a different kind — or a non-finite Float — is outside
// every range.
function inDeclaredRange(range, value) {
  if ("Bool" in range.min && "Bool" in range.max && "Bool" in value) {
    return true;
  }
  if ("Int" in range.min && "Int" in range.max && "Int" in value) {
    return range.min.Int <= value.Int && value.Int <= range.max.Int;
  }
  if ("Float" in range.min && "Float" in range.max && "Float" in value) {
    return range.min.Float <= value.Float && value.Float <= range.max.Float;
  }
  return false;
}

// Parses an operator entry into a Value of the parameter's declared
// kind, collecting the client-side warnings the entry draws — text that
// is not such a value, or a value outside the declared range. The
// warnings never block: the submission still goes through the receipted
// path, whose named rejection is what a refused edit displays.
function parameterValue(param, text) {
  const warnings = [];
  let value;
  if (param.kind === "Bool") {
    value = { Bool: text === "true" };
  } else if (param.kind === "Int") {
    if (!/^[-+]?\d+$/.test(text)) warnings.push("not an Int value");
    value = { Int: parseInt(text, 10) };
  } else {
    const parsed = Number(text);
    if (Number.isNaN(parsed)) warnings.push("not a Float value");
    value = { Float: parsed };
  }
  if (warnings.length === 0 && param.range &&
      !inDeclaredRange(param.range, value)) {
    warnings.push("outside declared range " +
      formatValue(param.range.min) + " … " + formatValue(param.range.max));
  }
  return { value, warnings };
}

// The instance's diagnostics row, joined from the snapshot's components
// section by name.
function diagnosticsMarkup(diag) {
  const ok = diag && diag.last_tick != null
    ? "last ok tick " + diag.last_tick
    : "no successful step";
  const errors = diag && diag.step_errors > 0
    ? " — <span class=\"errors\">" + diag.step_errors + " step error(s)" +
      (diag.last_error ? ": " + esc(diag.last_error) : "") + "</span>"
    : "";
  return "<div class=\"diag\">" + ok + errors + "</div>";
}

// A descriptor with no role hints and no parameters carries no custom
// faceplate information — it degrades to the generic
// name-plus-diagnostics-plus-wired-points view rather than an error.
function isGeneric(descriptor) {
  return descriptor.parameters.length === 0 &&
    !descriptor.ports.some(port => port.role != null);
}

function faceplateMarkup(descriptor, diag, telemetry) {
  const generic = isGeneric(descriptor);
  const parts = [
    "<section class=\"faceplate" + (generic ? " generic" : "") + "\">",
    "<h3>" + esc(descriptor.label) +
      " <span class=\"kind\">" + esc(descriptor.kind) + "</span></h3>",
  ];
  if (generic) {
    parts.push(portTable(descriptor.ports, telemetry));
  } else {
    const hinted = descriptor.ports
      .filter(port => port.role != null)
      .sort((a, b) => ROLE_ORDER[a.role] - ROLE_ORDER[b.role]);
    parts.push(hinted.map(port => roleElement(port, telemetry)).join(""));
    const unhinted = descriptor.ports.filter(port => port.role == null);
    if (unhinted.length > 0) parts.push(portTable(unhinted, telemetry));
  }
  if (descriptor.parameters.length > 0) {
    parts.push(parameterTable(descriptor));
  }
  parts.push(diagnosticsMarkup(diag));
  parts.push("</section>");
  return parts.join("");
}

// Re-renders every faceplate from the polled snapshot. Values an
// operator is mid-edit on — and an input's focus — survive the
// re-render, keyed by bound point for the write affordances and by
// component-plus-parameter for the tuning controls.
function renderFaceplates(snapshot, telemetry) {
  const pending = new Map();
  let focused = null;
  for (const input of document.querySelectorAll("#faceplates input.command-value")) {
    pending.set(input.dataset.point, input.value);
    if (input === document.activeElement) focused = input.dataset.point;
  }
  for (const control of document.querySelectorAll("#faceplates .param-value")) {
    const key = paramKey(control.dataset.component, control.dataset.param);
    pending.set(key, control.value);
    if (control === document.activeElement) focused = key;
  }
  descriptorByName.clear();
  for (const descriptor of snapshot.descriptors) {
    descriptorByName.set(descriptor.name, descriptor);
  }
  const diagnostics = new Map(snapshot.components.map(c => [c.name, c]));
  document.getElementById("faceplates").innerHTML = snapshot.descriptors
    .map(descriptor => faceplateMarkup(descriptor, diagnostics.get(descriptor.name), telemetry))
    .join("");
  for (const input of document.querySelectorAll("#faceplates input.command-value")) {
    if (pending.has(input.dataset.point)) input.value = pending.get(input.dataset.point);
    if (input.dataset.point === focused) input.focus();
  }
  for (const control of document.querySelectorAll("#faceplates .param-value")) {
    const key = paramKey(control.dataset.component, control.dataset.param);
    if (pending.has(key)) control.value = pending.get(key);
    if (key === focused) control.focus();
  }
}

// One inline-SVG trend panel per point, built once from the signal index.
function buildTrends() {
  document.getElementById("trends").innerHTML = index.points.map(meta =>
    "<figure class=\"trend\">" +
    "<figcaption id=\"trend-caption-" + meta.point + "\">" + esc(meta.name) + "</figcaption>" +
    "<svg id=\"trend-" + meta.point + "\" viewBox=\"0 0 320 90\" width=\"320\" height=\"90\"></svg>" +
    "</figure>").join("");
  for (const meta of index.points) {
    trends.set(meta.point, { samples: [], lastSeq: 0, lastTick: null });
  }
}

// Fetches each point's history increments from the current source.
// Every point's ring shares the scan cadence, so the smallest seen seq
// is a safe common cursor; each point's own lastSeq still dedupes what
// the fetch returns, and lastTick dedupes across a source switch — the
// new peer's ring re-serves ticks already drawn, which are skipped.
async function refreshTrends(base) {
  const states = [...trends.values()];
  let since = 0;
  if (states.length > 0 && states.every(state => state.lastSeq > 0)) {
    since = Math.min(...states.map(state => state.lastSeq));
  }
  const histories = await (await fetch(base + "/history?since=" + since)).json();
  for (const history of histories) {
    const state = trends.get(history.point);
    if (!state) continue;
    for (const entry of history.samples) {
      if (entry.seq <= state.lastSeq) continue;
      state.lastSeq = entry.seq;
      if (state.lastTick !== null && entry.sample.tick <= state.lastTick) {
        continue;
      }
      state.samples.push(entry.sample);
      state.lastTick = entry.sample.tick;
    }
    if (state.samples.length > TREND_LIMIT) {
      state.samples.splice(0, state.samples.length - TREND_LIMIT);
    }
  }
  for (const meta of index.points) drawTrend(meta);
}

// Draws one point's retained series as a polyline; samples with non-good
// quality get a marker dot in the quality's color, so a degraded stretch
// is visible on the trend itself.
function drawTrend(meta) {
  const state = trends.get(meta.point);
  const svg = document.getElementById("trend-" + meta.point);
  const caption = document.getElementById("trend-caption-" + meta.point);
  const latest = state.samples[state.samples.length - 1];
  caption.textContent = meta.name + " (point " + meta.point + ")" +
    (meta.unit ? " [" + meta.unit + "]" : "") + (latest
      ? " — latest " + formatValue(latest.value) + " at tick " + latest.tick +
        ", " + state.samples.length + " samples, ticks " +
        state.samples[0].tick + "–" + latest.tick
      : " — no samples");
  const coords = state.samples
    .map((sample, i) => ({ i, v: numericValue(sample.value), sample }))
    .filter(c => c.v != null);
  if (coords.length === 0) {
    svg.innerHTML = "";
    return;
  }
  const min = Math.min(...coords.map(c => c.v));
  const max = Math.max(...coords.map(c => c.v));
  let lo = min, hi = max;
  if (lo === hi) { lo -= 1; hi += 1; }
  const W = 320, H = 90, padX = 8, padY = 14;
  const n = state.samples.length;
  const px = i => padX + (W - 2 * padX) * (n > 1 ? i / (n - 1) : 0.5);
  const py = v => H - padY - (H - 2 * padY) * (v - lo) / (hi - lo);
  let body =
    "<text class=\"limit\" x=\"" + padX + "\" y=\"10\">" + esc(max) + "</text>" +
    "<text class=\"limit\" x=\"" + padX + "\" y=\"" + (H - 4) + "\">" + esc(min) + "</text>" +
    "<polyline points=\"" +
    coords.map(c => px(c.i).toFixed(1) + "," + py(c.v).toFixed(1)).join(" ") +
    "\"/>";
  for (const c of coords) {
    if (!isGood(c.sample.quality)) {
      body += "<circle class=\"" + qualityClass(c.sample.quality) +
        "\" cx=\"" + px(c.i).toFixed(1) + "\" cy=\"" + py(c.v).toFixed(1) +
        "\" r=\"3\"><title>tick " + c.sample.tick + ": " +
        esc(formatQuality(c.sample.quality)) + "</title></circle>";
    }
  }
  svg.innerHTML = body;
}

// Fetches the journal increment from the current source and re-renders
// the pane in tick order — the endpoint returns entries oldest-first.
// Entries merge by tick plus event identity, so a whole-journal re-fetch
// after a source switch adds each transition once: both peers journal
// the same run's events, and each journals its own role changes.
async function refreshJournal(base) {
  const entries = await (await fetch(base + "/journal?since=" + journalSince)).json();
  for (const entry of entries) {
    journalSince = Math.max(journalSince, entry.seq);
    const key = entry.tick + " " + JSON.stringify(entry.event);
    if (!journalSeen.has(key)) {
      journalSeen.add(key);
      journalEntries.push(entry);
      // A settled set_parameter receipt is the authority's final word on
      // a tuning submission: the applied tick or the named rejection
      // surfaces on the parameter's faceplate row as well as in this
      // pane, replacing any advisory warning the entry drew.
      const settled = entry.event.command_settled;
      if (settled && settled.receipt.command.set_parameter) {
        const tuning = settled.receipt.command.set_parameter;
        setParamStatus(tuning.component, tuning.name, {
          text: describeOutcome(settled.receipt.outcome),
          warn: false,
          bad: "rejected" in settled.receipt.outcome,
        });
      }
    }
  }
  journalEntries.sort((a, b) => a.tick - b.tick || a.seq - b.seq);
  if (journalEntries.length > JOURNAL_LIMIT) {
    for (const entry of journalEntries.splice(0, journalEntries.length - JOURNAL_LIMIT)) {
      journalSeen.delete(entry.tick + " " + JSON.stringify(entry.event));
    }
  }
  document.getElementById("journal").innerHTML = journalEntries.map(entry =>
    "<tr><td>" + entry.seq + "</td><td>" + entry.tick + "</td><td>" +
    esc(describeEvent(entry.event)) + "</td></tr>").join("");
}

// Journal events serialize as {"quality_changed": ...} |
// {"command_settled": ...} | {"step_failed": ...} |
// {"role_changed": {from, to}} |
// {"divergence_detected": {mismatches}}.
function describeEvent(event) {
  if ("quality_changed" in event) {
    const change = event.quality_changed;
    return pointName(change.point) + " quality " +
      (change.from ? formatQuality(change.from) : "no prior sample") +
      " → " + formatQuality(change.to);
  }
  if ("command_settled" in event) {
    const receipt = event.command_settled.receipt;
    return describeCommand(receipt.command) + " — " +
      describeOutcome(receipt.outcome);
  }
  if ("step_failed" in event) {
    const failure = event.step_failed;
    return "component " + failure.component + " step failed: " + failure.error;
  }
  if ("role_changed" in event) {
    const change = event.role_changed;
    return "reported role " + change.from + " → " + change.to;
  }
  if ("divergence_detected" in event) {
    return "standby diverged: staged outputs mismatch the field at " +
      event.divergence_detected.mismatches.map(m =>
        pointName(m.point) + " (staged " + formatValue(m.staged) +
        ", field " + formatValue(m.field) + ")").join(", ");
  }
  return JSON.stringify(event);
}

// A command serializes as {"write_value": {point, kind, value}} |
// {"set_parameter": {component, name, value}}.
function describeCommand(command) {
  if ("write_value" in command) {
    const write = command.write_value;
    return "write " + pointName(write.point) + " := " + formatValue(write.value);
  }
  if ("set_parameter" in command) {
    const tuning = command.set_parameter;
    return "tune " + tuning.component + "." + tuning.name + " := " +
      formatValue(tuning.value);
  }
  return JSON.stringify(command);
}

// An outcome serializes as {"accepted": {apply_tick}} |
// {"applied": {tick}} | {"rejected": {reason}}.
function describeOutcome(outcome) {
  if ("applied" in outcome) return "applied at tick " + outcome.applied.tick;
  if ("accepted" in outcome) {
    return "accepted for tick " + outcome.accepted.apply_tick;
  }
  if ("rejected" in outcome) {
    return "rejected: " + describeReason(outcome.rejected.reason);
  }
  return JSON.stringify(outcome);
}

// A rejection reason serializes as {"unknown_point": {point}} |
// {"not_writable": {point}} |
// {"type_mismatch": {point, expected, found}} |
// {"driver_rejected": {point, error}} | {"not_active": {point, role}} |
// the parameter-command reasons
// {"unknown_component"|"unknown_parameter"|"unsupported_parameter"|
// "parameter_type_mismatch"|"out_of_range"|"invalid_parameter": {...}},
// each carrying the offending component.
function describeReason(reason) {
  if ("unknown_point" in reason) {
    return "unknown point " + reason.unknown_point.point;
  }
  if ("not_writable" in reason) {
    return pointName(reason.not_writable.point) +
      " is not declared writable — the model marks the command surface";
  }
  if ("type_mismatch" in reason) {
    const mismatch = reason.type_mismatch;
    return "type mismatch on " + pointName(mismatch.point) + ": expected " +
      mismatch.expected + ", found " + formatValue(mismatch.found);
  }
  if ("driver_rejected" in reason) {
    const rejection = reason.driver_rejected;
    return "driver rejected " + pointName(rejection.point) + ": " +
      describeIoError(rejection.error);
  }
  if ("not_active" in reason) {
    return "refused: peer reports role " + reason.not_active.role +
      "; commands apply only on the active peer";
  }
  if ("unknown_component" in reason) {
    return "unknown component " + reason.unknown_component.component;
  }
  if ("unknown_parameter" in reason) {
    const rejection = reason.unknown_parameter;
    return rejection.component + " declares no parameter " + rejection.parameter;
  }
  if ("unsupported_parameter" in reason) {
    const rejection = reason.unsupported_parameter;
    return rejection.component + " exposes no writable parameters, refused " +
      rejection.parameter;
  }
  if ("parameter_type_mismatch" in reason) {
    const rejection = reason.parameter_type_mismatch;
    return "parameter " + rejection.component + "." + rejection.parameter +
      " expects " + rejection.expected + ", found " + formatValue(rejection.found);
  }
  if ("out_of_range" in reason) {
    const rejection = reason.out_of_range;
    return "parameter " + rejection.component + "." + rejection.parameter +
      " value " + formatValue(rejection.value) + " outside declared range [" +
      formatValue(rejection.range.min) + ", " + formatValue(rejection.range.max) + "]";
  }
  if ("invalid_parameter" in reason) {
    const rejection = reason.invalid_parameter;
    return rejection.component + " rejected parameter " + rejection.parameter +
      ": " + rejection.detail;
  }
  return JSON.stringify(reason);
}

function commandValue(kind, text) {
  if (kind === "Bool") return { Bool: /^(true|1|on)$/i.test(text.trim()) };
  if (kind === "Int") return { Int: parseInt(text, 10) };
  return { Float: parseFloat(text) };
}

// POSTs the Command JSON to a peer. Content-Type text/plain keeps a
// cross-origin POST a simple request — no preflight — while the endpoint
// parses the same JSON body regardless of the declared type.
async function postCommand(base, command) {
  const response = await fetch(base + "/command", {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(command),
  });
  return response.json();
}

function isNotActive(receipt) {
  return receipt && receipt.outcome && receipt.outcome.rejected &&
    receipt.outcome.rejected.reason &&
    "not_active" in receipt.outcome.rejected.reason;
}

// Submits an operator command to the peer reporting settled "active" —
// never to a standby. A not_active rejection means the pair moved
// mid-flight: roles are re-polled and the command retried once against
// the peer now reporting active, per the pair-view rule. Answers the
// peer's response — normally the command's receipt — so the caller can
// surface it beside the control that submitted; null when nothing was
// sent.
async function submitCommand(command) {
  const receipt = document.getElementById("receipt");
  let target = activePeer();
  if (target < 0) {
    await pollRoles();
    renderPair();
    target = activePeer();
  }
  if (target < 0) {
    receipt.textContent =
      "not sent: no peer reports role active — the pair is mid-transition";
    return null;
  }
  let answer = await postCommand(peers[target].base, command);
  if (isNotActive(answer)) {
    await pollRoles();
    renderPair();
    target = activePeer();
    if (target >= 0) answer = await postCommand(peers[target].base, command);
  }
  receipt.textContent = JSON.stringify(answer, null, 2);
  return answer;
}

// A parameter edit submits a set_parameter command addressed to the
// instance — {set_parameter: {component, name, value}} — through the
// same receipted, active-peer-routed path every operator command takes.
// The descriptor is the page's authority for kind and range: an
// unparseable or out-of-range entry is warned client-side on the row
// but still sent — the receipted path stays the authority, and a named
// rejection displays rather than the edit dropping silently.
async function submitParameter(button) {
  const component = button.dataset.component;
  const name = button.dataset.param;
  const control = button.parentElement.querySelector(".param-value");
  const descriptor = descriptorByName.get(component);
  const param = descriptor &&
    descriptor.parameters.find(candidate => candidate.name === name);
  if (!control || !param) return;
  const text = control.value.trim();
  if (param.kind !== "Bool" && text === "") {
    setParamStatus(component, name,
      { text: "enter a value", warn: true, bad: false });
    return;
  }
  const parsed = parameterValue(param, text);
  const command = { set_parameter: {
    component: component, name: name, value: parsed.value } };
  let answer;
  try {
    answer = await submitCommand(command);
  } catch (error) {
    document.getElementById("receipt").textContent = "command failed: " + error;
    setParamStatus(component, name,
      { text: "command failed: " + error, warn: false, bad: true });
    return;
  }
  const verdict = answer && answer.outcome
    ? describeOutcome(answer.outcome)
    : answer === null
      ? "not sent: no peer reports role active"
      : String(answer);
  setParamStatus(component, name, {
    text: (parsed.warnings.length > 0
      ? "warning: " + parsed.warnings.join("; ") + " — " : "") + verdict,
    warn: parsed.warnings.length > 0,
    bad: !answer || !answer.outcome || "rejected" in answer.outcome,
  });
}

async function init() {
  index = await (await fetch("/signals")).json();
  for (const meta of index.points) metaByPoint.set(meta.point, meta);
  const select = document.getElementById("command-point");
  // The command form offers only the model-declared writable points —
  // the index carries each io_point's `writable` mark, and writes to
  // anything else reject with not_writable.
  select.innerHTML = index.points.filter(p => p.writable).map(p =>
    "<option value=\"" + p.point + "\">" + esc(p.name) +
    " (point " + p.point + ")</option>").join("");
  buildTrends();
  // Faceplate command affordances: one delegated listener — the
  // affordances themselves re-render on every poll. The writable gate
  // is the same metadata check the renderer applied: a point the model
  // did not mark writable is never commanded from the page. A tune
  // button submits its parameter's edit through submitParameter — the
  // same receipted path.
  const faceplates = document.getElementById("faceplates");
  faceplates.addEventListener("click", async event => {
    const tune = event.target.closest("button.tune");
    if (tune) {
      await submitParameter(tune);
      refresh();
      return;
    }
    const button = event.target.closest("button.write");
    if (!button) return;
    const input = button.parentElement.querySelector("input.command-value");
    const meta = metaByPoint.get(Number(button.dataset.point));
    if (!meta || !meta.writable || !input) return;
    if (input.value.trim() === "") {
      document.getElementById("receipt").textContent =
        "enter a value for " + meta.name;
      return;
    }
    const command = { write_value: {
      point: meta.point,
      kind: meta.value_type,
      value: commandValue(meta.value_type, input.value),
    } };
    try {
      await submitCommand(command);
      input.value = "";
    } catch (error) {
      document.getElementById("receipt").textContent = "command failed: " + error;
    }
    refresh();
  });
  // Enter inside an affordance input submits like its button.
  faceplates.addEventListener("keydown", event => {
    if (event.key !== "Enter") return;
    const input = event.target.closest("input.command-value");
    if (input) {
      const button = input.parentElement.querySelector("button.write");
      if (button) button.click();
      return;
    }
    const control = event.target.closest(".param-value");
    if (!control) return;
    const tune = control.parentElement.querySelector("button.tune");
    if (tune) tune.click();
  });
  document.getElementById("command-form").addEventListener("submit", async event => {
    event.preventDefault();
    const point = Number(select.value);
    const meta = index.points.find(p => p.point === point);
    if (!meta) return;
    const command = { write_value: {
      point: point,
      kind: meta.value_type,
      value: commandValue(meta.value_type, document.getElementById("command-value").value),
    } };
    try {
      await submitCommand(command);
    } catch (error) {
      document.getElementById("receipt").textContent = "command failed: " + error;
    }
    refresh();
  });
  refresh();
  setInterval(refresh, 1000);
}

init().catch(error => {
  document.getElementById("status").textContent =
    "failed to load signal metadata: " + error;
});
</script>
</body>
</html>
