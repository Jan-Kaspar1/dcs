    ? describeOutcome(answer.outcome)
    : answer === null
      ? "not sent: no peer reports role active"
      : String(answer);
  setParamStatus(component, name, {
    text: (parsed.warnings.length > 0
      ? "warning: " + parsed.warnings.join("; ") + " — " : "") + verdict,
    warn: parsed.warnings.length > 0,
    bad: !answer || !answer.outcome || "rejected" in answer.outcome,
  });
}

// A force submission from any of the page's affordances: the bound
// point's metadata supplies the kind, the sibling input supplies the
// value, and {force_point: {point, kind, value}} takes the same
// receipted, active-peer-routed path as a write — a rejected force
// surfaces its named reason in the receipt pane and the journal. The
// writable-In gate mirrors the renderer's, so the button never offers
// what the contract would refuse.
async function submitForce(button) {
  const meta = metaByPoint.get(Number(button.dataset.point));
  const input = button.parentElement.querySelector("input.command-value");
  if (!meta || !meta.writable || meta.direction !== "in" || !input) return;
  const text = input.value.trim();
  if (text === "") {
    document.getElementById("receipt").textContent =
      "enter a value to force " + meta.name + " to";
    return;
  }
  const command = { force_point: {
    point: meta.point,
    kind: meta.value_type,
    value: commandValue(meta.value_type, text),
  } };
  try {
    await submitCommand(command);
    input.value = "";
  } catch (error) {
    document.getElementById("receipt").textContent = "command failed: " + error;
  }
  refresh();
}

// A release submission: {unforce_point: {point}} through the same
// receipted path. The release is idempotent on the controller, so no
// force-set check gates it — the badge clears on the next snapshot once
// the release applies at its scan boundary.
async function submitUnforce(button) {
  const command = { unforce_point: { point: Number(button.dataset.point) } };
  try {
    await submitCommand(command);
  } catch (error) {
    document.getElementById("receipt").textContent = "command failed: " + error;
  }
  refresh();
}

async function init() {
  // Overview mode: configured ?pair= parameters switch the page to the
  // plant overview — the per-pair detail surface stays hidden and the
  // cards poll each pair's own endpoints, so the serving origin's model
  // never loads here.
  if (overviewPairs.length > 0) {
    document.getElementById("detail").hidden = true;
    document.getElementById("overview").hidden = false;
    renderOverview();
    refreshOverview();
    setInterval(refreshOverview, 1000);
    return;
  }
  index = await (await fetch("/signals")).json();
  for (const meta of index.points) metaByPoint.set(meta.point, meta);
  const select = document.getElementById("command-point");
  // The command form offers only the model-declared writable points —
  // the index carries each io_point's `writable` mark, and writes to
  // anything else reject with not_writable.
  select.innerHTML = index.points.filter(p => p.writable).map(p =>
    "<option value=\"" + p.point + "\">" + esc(p.name) +
    " (point " + p.point + ")</option>").join("");
  // The configured operator identity shows beside the form — the actor
  // every submission declares — so the console states the attribution
  // its commands will carry (declared, not authenticated).
  document.getElementById("command-actor").textContent = operator === null
    ? "commands submit unattributed — ?operator=<name> declares an actor"
    : "commands declare actor \"" + operator +
      "\" — declared identity, not authenticated";
  buildTrends();
  // Command affordances: delegated listeners — the affordances
  // themselves re-render on every poll. The writable gate is the same
  // metadata check the renderer applied: a point the model did not
  // mark writable is never commanded from the page. A tune button
  // submits its parameter's edit through submitParameter, a force or
  // release button through submitForce/submitUnforce — the same
  // receipted path.
  const faceplates = document.getElementById("faceplates");
  faceplates.addEventListener("click", async event => {
    const tune = event.target.closest("button.tune");
    if (tune) {
      await submitParameter(tune);
      refresh();
      return;
    }
    const force = event.target.closest("button.force");
    if (force) {
      await submitForce(force);
      return;
    }
    const unforce = event.target.closest("button.unforce");
    if (unforce) {
      await submitUnforce(unforce);
      return;
    }
    const button = event.target.closest("button.write");
    if (!button) return;
    const input = button.parentElement.querySelector("input.command-value");
    const meta = metaByPoint.get(Number(button.dataset.point));
    if (!meta || !meta.writable || !input) return;
    if (input.value.trim() === "") {
      document.getElementById("receipt").textContent =
        "enter a value for " + meta.name;
      return;
    }
    const command = { write_value: {
      point: meta.point,
      kind: meta.value_type,
      value: commandValue(meta.value_type, input.value),
    } };
    try {
      await submitCommand(command);
      input.value = "";
    } catch (error) {
      document.getElementById("receipt").textContent = "command failed: " + error;
    }
    refresh();
  });
  // The alarm pane's ack affordance takes the same delegated shape —
  // the rows re-render on every poll.
  document.getElementById("alarm-pane").addEventListener("click", async event => {
    const ack = event.target.closest("button.ack");
    if (ack) await submitAck(ack);
  });
  // The point listing's force and release affordances take the same
  // delegated shape — the rows re-render on every poll.
  const points = document.getElementById("points");
  points.addEventListener("click", async event => {
    const force = event.target.closest("button.force");
    if (force) {
      await submitForce(force);
      return;
    }
    const unforce = event.target.closest("button.unforce");
    if (unforce) await submitUnforce(unforce);
  });
  // Enter inside an affordance input submits like its button.
  faceplates.addEventListener("keydown", event => {
    if (event.key !== "Enter") return;
    const input = event.target.closest("input.command-value");
    if (input) {
      const button = input.parentElement.querySelector("button.write");
      if (button) button.click();
      return;
    }
    const control = event.target.closest(".param-value");
    if (!control) return;
    const tune = control.parentElement.querySelector("button.tune");
    if (tune) tune.click();
  });
  points.addEventListener("keydown", event => {
    if (event.key !== "Enter") return;
    const input = event.target.closest("input.command-value");
    if (!input) return;
    const force = input.parentElement.querySelector("button.force");
    if (force) force.click();
  });
  document.getElementById("command-form").addEventListener("submit", async event => {
    event.preventDefault();
    const point = Number(select.value);
    const meta = index.points.find(p => p.point === point);
    if (!meta) return;
    const command = { write_value: {
      point: point,
      kind: meta.value_type,
      value: commandValue(meta.value_type, document.getElementById("command-value").value),
    } };
    try {
      await submitCommand(command);
    } catch (error) {
      document.getElementById("receipt").textContent = "command failed: " + error;
    }
    refresh();
  });
  // The form's force affordance: the select already offers only
  // model-declared writable points — In points, the force contract's
  // only legal target — and the value entry supplies the pin.
  document.getElementById("command-force").addEventListener("click", async () => {
    const point = Number(select.value);
    const meta = index.points.find(p => p.point === point);
    if (!meta) return;
    const text = document.getElementById("command-value").value.trim();
    if (text === "") {
      document.getElementById("receipt").textContent =
        "enter a value to force " + meta.name + " to";
      return;
    }
    const command = { force_point: {
      point: point,
      kind: meta.value_type,
      value: commandValue(meta.value_type, text),
    } };
    try {
      await submitCommand(command);
    } catch (error) {
      document.getElementById("receipt").textContent = "command failed: " + error;
    }
    refresh();
  });
  refresh();
  setInterval(refresh, 1000);
}

init().catch(error => {
  document.getElementById("status").textContent =
    "failed to load signal metadata: " + error;
});
</script>
</body>
</html>
