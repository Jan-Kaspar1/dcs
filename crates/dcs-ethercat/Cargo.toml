[package]
name = "dcs-ethercat"
description = "EtherCAT device kind for the DCS plant model: field-bus identity, process-image mapping, startup policy contract, and the EtherCrab-backed cyclic master"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dcs-core = { path = "../dcs-core" }
dcs-model = { path = "../dcs-model" }
# The EtherCAT master stack, pinned exactly per the stack evaluation:
# 0.7.1, MSRV 1.85 (<= toolchain 1.98.1), MIT OR Apache-2.0. `std`
# without default features keeps the plain raw-socket TX/RX path and
# leaves io-uring/xdp out of the dependency tree.
ethercrab = { version = "=0.7.1", default-features = false, features = ["std"] }
# The bus thread's small executor and request channel — smol-scale
# pieces only; no tokio enters the runtime path.
async-channel = "2.5.0"
futures-lite = "2.6.0"
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
# The registry/assembly integration tests drive `resolve_drivers` and
# `FanoutDriver`; `dcs-assembly` depends on this crate's parameter
# contract, so the cycle is dev-only — permitted for test targets.
dcs-assembly = { path = "../dcs-assembly" }
