[package]
name = "dcs-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dcs-assembly = { path = "../dcs-assembly" }
dcs-blocks = { path = "../dcs-blocks" }
dcs-core = { path = "../dcs-core" }
dcs-model = { path = "../dcs-model" }
dcs-monitor = { path = "../dcs-monitor" }
dcs-runtime = { path = "../dcs-runtime" }
dcs-sim = { path = "../dcs-sim" }
dcs-sim-net = { path = "../dcs-sim-net" }
serde_json = "1.0.151"

[dev-dependencies]
# The dosing acceptance test addresses the emitted skid's declared
# points through the builder's layout rather than duplicating ids.
dcs-build = { path = "../dcs-build" }
dcs-demo = { path = "../dcs-demo" }
# The Wago rig test binds the checked-in ethercat document to a fake
# transport playing the field wiring — the only hardware-free path.
dcs-ethercat = { path = "../dcs-ethercat" }
# The sim-bus failover rig observes the register bank and builds the
# reference run's driver side through BusDriver directly.
dcs-sim-bus = { path = "../dcs-sim-bus" }
