[package]
name = "dcs-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dcs-core = { path = "../dcs-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# The dynamics-schema drift test's validator; remote-ref resolution is
# unused, so the default resolver/TLS features stay off.
jsonschema = { version = "=0.55.0", default-features = false }
