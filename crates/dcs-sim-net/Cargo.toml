[package]
name = "dcs-sim-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
dcs-core = { path = "../dcs-core" }
dcs-sim = { path = "../dcs-sim" }
serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip` is required, not optional: the wire protocol must carry
# f64 point values bit-exactly or remote and local runs diverge by a ULP.
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
dcs-runtime = { path = "../dcs-runtime" }
