<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="984" viewBox="0 0 1480 984" role="img" aria-labelledby="title description">
<title id="title">Operator HMI appearance target: fictitious two-pump inlet station</title>
<desc id="description">Original documentation concept. A narrow plant navigation tree, permanent alarm strip, connected process schematic, compact contextual measurements and a right equipment faceplate. Pump P101 is running in Auto and has an unacknowledged priority 2 bearing-temperature alarm. Pump P102 is stopped and available. Equipment and pipes use neutral grays. A separate temperature sensor has bad data and its value is withheld. This fictitious topology and data are not the running demo or an engineering drawing.</desc>
